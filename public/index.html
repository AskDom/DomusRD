<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Domify — Portal inmobiliario dominicano. Encontrá apartamentos, casas y villas en venta o renta en toda República Dominicana."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->

    <!--
      Open Graph / Twitter Card — hoy son estáticos (mismo preview para
      cualquier URL del sitio). Si más adelante querés que cada propiedad
      comparta su propia foto/título/precio al pegar el link en WhatsApp,
      hace falta generarlos por página (react-helmet-async o un endpoint de
      prerender), porque CRA sirve el mismo index.html para todas las rutas
      y la mayoría de los crawlers de redes sociales no ejecutan JS.
      og:image usa una ruta relativa a %PUBLIC_URL% — si en algún cliente no
      carga la imagen del preview, reemplazar por la URL absoluta de
      producción (ej. https://domify.com/logo512.png).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Domify" />
    <meta property="og:title" content="Domify — Portal inmobiliario dominicano" />
    <meta property="og:description" content="Encontrá apartamentos, casas y villas en venta o renta en toda República Dominicana." />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />
    <meta property="og:locale" content="es_DO" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Domify — Portal inmobiliario dominicano" />
    <meta name="twitter:description" content="Encontrá apartamentos, casas y villas en venta o renta en toda República Dominicana." />
    <meta name="twitter:image" content="%PUBLIC_URL%/logo512.png" />

    <title>Domify — Portal inmobiliario dominicano</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
